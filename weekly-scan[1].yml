name: Tier 1 Weekly Website Security Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run passive security monitor
        run: python monitor.py
      - name: Upload timestamped reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-security-reports
          path: reports/
          if-no-files-found: warn
